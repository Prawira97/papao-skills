  measurement:
    proxy_metric_id: bounty_report_contact_verification
    success_criterion: Every email bounty report in the window goes only to an address verified from the program official source before sending, with a bounce check recorded after sending and before any later send to the same program, and zero reports are sent to an address already known to have bounced.
    window_days: 14
  rationale: 'Two Pacifica reports (Print Low and Edit Low) were sent to security@pacifica.fi and both bounced because that address does not exist, yet each was first reported as SENT because Gmail Sent only confirms the message left the mailbox. The Edit report went to the same dead address about five hours after the Print bounce, so the failure repeated instead of being caught, and the corrected address ops@pacifica.fi was only found in the official docs after the correction, with about $1,000 in first-report reward at stake. No managed skill covers first-send contact verification: bug_bounty_finding_alert covers notification timing only, muse_bug_bounty covers the Meta program only, and bug_bounty_specialist covers resend verification against Sent but not verifying the contact before the first send or checking for bounces before a later send. This new managed skill adds those two checks.'
